{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4">

                <!-- HEADER -->

                <div class="card-header bg-dark text-white text-center p-4 rounded-top-4">

                    <h2>

                        Admin Forgot Password

                    </h2>

                    <p class="mb-0">

                        Verify admin email to reset password

                    </p>

                </div>

                <!-- BODY -->

                <div class="card-body p-4">

                    {% if messages %}

                        {% for message in messages %}

                        <div class="alert alert-danger">

                            {{ message }}

                        </div>

                        {% endfor %}

                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">

                                Admin Email

                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control form-control-lg"
                                   placeholder="Enter admin email"
                                   required>

                        </div>

                        <button class="btn btn-dark w-100 btn-lg">

                            Verify Email

                        </button>

                    </form>

                </div>

                <!-- FOOTER -->

                <div class="card-footer text-center bg-light">

                    <a href="{% url 'admin_login' %}"
                       class="text-decoration-none">

                        Back to Admin Login

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<style>

body{

    background:#f5f7fa;

}

.card{

    border-radius:20px;

}

.form-control{

    border-radius:12px;

}

.btn{

    border-radius:12px;

}

</style>

{% endblock %}
