<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Airline Admin Panel
    </title>

    <!-- BOOTSTRAP -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

    *{

        margin:0;

        padding:0;

        box-sizing:border-box;

    }

    body{

        background:#f4f6f9;

        font-family:Arial, sans-serif;

    }

    /* SIDEBAR */

    .sidebar{

        width:270px;

        height:100vh;

        position:fixed;

        left:0;

        top:0;

        background:linear-gradient(
            180deg,
            #0d1b2a,
            #1b263b
        );

        padding:25px 15px;

        overflow-y:auto;

        box-shadow:5px 0 20px rgba(0,0,0,0.1);

    }

    /* LOGO */

    .logo-box{

        text-align:center;

        margin-bottom:40px;

    }

    .logo-icon{

        width:80px;

        height:80px;

        background:#0d6efd;

        color:white;

        border-radius:50%;

        display:flex;

        justify-content:center;

        align-items:center;

        font-size:35px;

        margin:auto;

        margin-bottom:15px;

        box-shadow:0 5px 15px rgba(13,110,253,0.4);

    }

    .logo-box h3{

        color:white;

        font-weight:bold;

        margin-bottom:5px;

    }

    .logo-box p{

        color:#adb5bd;

        font-size:14px;

    }

    /* MENU */

    .menu-title{

        color:#adb5bd;

        font-size:13px;

        text-transform:uppercase;

        margin-bottom:15px;

        margin-left:10px;

        letter-spacing:1px;

    }

    .sidebar a{

        display:flex;

        align-items:center;

        gap:12px;

        color:white;

        text-decoration:none;

        padding:14px 18px;

        border-radius:14px;

        margin-bottom:10px;

        transition:0.3s;

        font-size:16px;

        font-weight:500;

    }

    .sidebar a i{

        width:22px;

        text-align:center;

    }

    .sidebar a:hover{

        background:#0d6efd;

        transform:translateX(5px);

    }

    .logout-btn{

        background:#dc3545;

    }

    .logout-btn:hover{

        background:#bb2d3b !important;

    }

    /* CONTENT */

    .content{

        margin-left:290px;

        padding:35px;

    }

    /* TOPBAR */

    .topbar{

        background:white;

        padding:18px 25px;

        border-radius:20px;

        box-shadow:0 3px 15px rgba(0,0,0,0.08);

        display:flex;

        justify-content:space-between;

        align-items:center;

        margin-bottom:30px;

    }

    .topbar h2{

        margin:0;

        font-weight:bold;

        color:#1b263b;

    }

    .admin-profile{

        display:flex;

        align-items:center;

        gap:12px;

    }

    .admin-profile img{

        width:45px;

        height:45px;

        border-radius:50%;

        object-fit:cover;

    }

    .admin-profile h6{

        margin:0;

        font-weight:bold;

    }

    .admin-profile p{

        margin:0;

        font-size:13px;

        color:gray;

    }

    /* MAIN CARD */

    .main-card{

        background:white;

        border-radius:25px;

        padding:30px;

        box-shadow:0 5px 20px rgba(0,0,0,0.08);

    }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <!-- LOGO -->

    <div class="logo-box">

        <div class="logo-icon">

            <i class="fa-solid fa-plane"></i>

        </div>

        <h3>
            Airline Admin
        </h3>

        <p>
            Reservation Management
        </p>

    </div>

    <!-- MENU -->

    <div class="menu-title">

        Main Menu

    </div>

    <a href="/adminpanel/">

        <i class="fa-solid fa-chart-line"></i>

        Dashboard

    </a>

    <a href="/adminpanel/flights/">

        <i class="fa-solid fa-plane-departure"></i>

        Manage Flights

    </a>

    <a href="/adminpanel/flights/add/">

        <i class="fa-solid fa-circle-plus"></i>

        Add Flight

    </a>

    <a href="/adminpanel/bookings/">

        <i class="fa-solid fa-ticket"></i>

        Manage Bookings

    </a>

    <a href="/adminpanel/users/">

        <i class="fa-solid fa-users"></i>

        Manage Users

    </a>
    <a href="/adminpanel/change-password/">

    <i class="fa-solid fa-key"></i>

    Change Password

</a>

    <a href="/adminpanel/logout/"
       class="logout-btn">

        <i class="fa-solid fa-right-from-bracket"></i>

        Logout

    </a>
    

</div>

<!-- CONTENT -->

<div class="content">

    <!-- TOPBAR -->

    <div class="topbar">

        <h2>

            Airline Reservation Admin Panel

        </h2>

        <div class="admin-profile">

            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

            <div>

                <h6>
                    Admin
                </h6>

                <p>
                    System Administrator
                </p>

            </div>

        </div>

    </div>

    <!-- PAGE CONTENT -->

    <div class="main-card">

        {% block content %}
        {% endblock %}

    </div>

</div>

<!-- Generic Confirmation Modal -->
<div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true" style="z-index: 9999;">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 border-0 shadow-lg" style="background: white;">
      <div class="modal-header border-0 bg-light p-4 rounded-top-4">
        <h5 class="modal-title fw-bold text-dark" id="confirmModalLabel">Confirm Action</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 text-secondary" id="confirmModalBody" style="font-size: 15px;">
        Are you sure you want to proceed?
      </div>
      <div class="modal-footer border-0 p-4 bg-light rounded-bottom-4">
        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" id="confirmModalYesBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
function showConfirm(message, callback) {
    const modalEl = document.getElementById('confirmModal');
    if (!modalEl) return;
    
    document.getElementById('confirmModalBody').innerText = message;
    
    const confirmBtn = document.getElementById('confirmModalYesBtn');
    
    // Remove old listeners by cloning
    const newConfirmBtn = confirmBtn.cloneNode(true);
    confirmBtn.parentNode.replaceChild(newConfirmBtn, confirmBtn);
    
    const bootstrapModal = bootstrap.Modal.getOrCreateInstance(modalEl);
    
    newConfirmBtn.addEventListener('click', function() {
        bootstrapModal.hide();
        callback();
    });
    
    bootstrapModal.show();
}
</script>

<!-- BOOTSTRAP JS BUNDLE -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
