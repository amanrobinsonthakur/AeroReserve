{% extends 'base.html' %}

{% block content %}

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="premium-card p-4 p-md-5 shadow-lg border-0">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-key fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Change Password</h3>
                    <p class="text-muted small">Update your AeroReserve password to secure your account.</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Old Password</label>
                        {{ form.old_password }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">New Password</label>
                        {{ form.new_password1 }}
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Confirm New Password</label>
                        {{ form.new_password2 }}
                    </div>

                    <button class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm mb-3" style="background: var(--primary-grad); border: none;">
                        Update Password <i class="fa-solid fa-circle-check ms-1"></i>
                    </button>
                    
                    <div class="text-center">
                        <a href="{% url 'user_profile' %}" class="small text-decoration-none fw-semibold">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Profile
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

<style>
    /* Make form widgets look premium since Django renders them directly */
    .premium-card input {
        display: block;
        width: 100%;
        padding: 12px 16px;
        font-size: 15px;
        border: 1.5px solid #e2e8f0;
        border-radius: 14px !important;
        transition: all 0.2s ease;
        outline: none;
    }
    .premium-card input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }
</style>

{% endblock %}
