{% extends 'base.html' %}

{% block content %}

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="premium-card p-4 p-md-5 shadow-lg border-0">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-lock-open fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Reset Password</h3>
                    <p class="text-muted small">Create a strong new password for your account.</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">New Password</label>
                        <input type="password" name="password" class="form-control premium-input w-100" placeholder="Enter new password" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control premium-input w-100" placeholder="Confirm new password" required>
                    </div>

                    <button class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm mb-3" style="background: var(--primary-grad); border: none;">
                        Reset Password <i class="fa-solid fa-circle-check ms-1"></i>
                    </button>
                    
                    <div class="text-center">
                        <a href="{% url 'login' %}" class="small text-decoration-none fw-semibold">
                            <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
