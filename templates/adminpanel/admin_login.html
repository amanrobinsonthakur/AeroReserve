<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Airline Admin Login
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

    body{

        margin:0;

        padding:0;

        min-height:100vh;

        display:flex;

        justify-content:center;

        align-items:center;

        background:linear-gradient(
            135deg,
            #0d6efd,
            #6610f2
        );

        font-family:Arial, sans-serif;

    }

    .login-container{

        width:100%;

        max-width:430px;

        padding:20px;

    }

    .login-card{

        background:white;

        border-radius:25px;

        padding:45px;

        box-shadow:0 10px 30px rgba(0,0,0,0.2);

        animation:fadeIn 0.6s ease;

    }

    @keyframes fadeIn{

        from{

            opacity:0;

            transform:translateY(20px);

        }

        to{

            opacity:1;

            transform:translateY(0);

        }

    }

    .logo{

        width:90px;

        height:90px;

        background:#0d6efd;

        color:white;

        display:flex;

        justify-content:center;

        align-items:center;

        border-radius:50%;

        margin:0 auto 20px;

        font-size:40px;

    }

    .login-title{

        text-align:center;

        margin-bottom:30px;

    }

    .login-title h2{

        font-weight:bold;

        margin-bottom:10px;

    }

    .login-title p{

        color:gray;

        margin:0;

    }

    .form-label{

        font-weight:600;

    }

    .form-control{

        border-radius:12px;

        padding:12px;

    }

    .input-group-text{

        border-radius:12px 0 0 12px;

        background:#f1f3f5;

    }

    .btn-login{

        background:#0d6efd;

        color:white;

        border:none;

        border-radius:12px;

        padding:12px;

        font-size:18px;

        font-weight:bold;

        transition:0.3s;

    }

    .btn-login:hover{

        background:#0b5ed7;

        transform:translateY(-2px);

    }

    .footer-text{

        text-align:center;

        margin-top:20px;

        color:gray;

        font-size:14px;

    }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-plane"></i>

        </div>

        <!-- TITLE -->

        <div class="login-title">

            <h2>
                Airline Admin
            </h2>

            <p>
                Secure Admin Panel Login
            </p>

        </div>

        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger">

            {{ error }}

        </div>

        {% endif %}

        <!-- FORM -->

        <form method="post">

            {% csrf_token %}

            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-user"></i>

                    </span>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter Username"
                           required>

                </div>

            </div>
<a href="{% url 'admin_forgot_password' %}">

    Forgot Password?

</a>
            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-lock"></i>

                    </span>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter Password"
                           required>

                </div>

            </div>

            <!-- BUTTON -->

            <button class="btn btn-login w-100">

                Login

            </button>

        </form>
       <hr>
        <a href="{% url 'landing_page' %}"
   class="home-btn">

    <i class="fa-solid fa-house"></i>

    Home

</a>

        <!-- FOOTER -->

        <div class="footer-text">

           Airline Reservation System

        </div>

    </div>

</div>

</body>
</html>
<style>

.home-btn{

    display:inline-flex;

    align-items:center;

    gap:8px;

    background:linear-gradient(
        135deg,
        #0d6efd,
        #6610f2
    );

    color:white;

    text-decoration:none;

    padding:10px 22px;

    border-radius:12px;

    font-weight:bold;

    transition:0.3s;

    box-shadow:0 4px 10px rgba(0,0,0,0.15);

}

.home-btn:hover{

    background:linear-gradient(
        135deg,
        #0b5ed7,
        #520dc2
    );

    transform:translateY(-2px);

    color:white;

}

</style>
