{% extends 'base.html' %}

{% block content %}

<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="premium-card p-4 p-md-5 shadow-lg border-0">
                
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-right-to-bracket fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark">User Login</h3>
                    <p class="text-muted small">Access your AeroReserve account to manage your flights.</p>
                </div>

                {% if error %}
                <div class="alert alert-danger border-0 rounded-4 p-3 small d-flex align-items-center mb-4">
                    <i class="fa-solid fa-triangle-exclamation me-2 fs-5"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">Username</label>
                        <div class="position-relative">
                            <input type="text" name="username" class="form-control premium-input w-100" placeholder="Enter username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <label class="form-label text-muted small fw-semibold mb-0">Password</label>
                            <a href="{% url 'forgot_password' %}" class="small text-decoration-none fw-semibold">Forgot Password?</a>
                        </div>
                        <input type="password" name="password" class="form-control premium-input w-100" placeholder="Enter password" required>
                    </div>

                    <button class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm" style="background: var(--primary-grad); border: none;">
                        Login <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="{% url 'register' %}" class="small text-decoration-none fw-bold">Register here</a>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
